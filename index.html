<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardiAnd · Gestión de guardias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    /* Variables de color basadas en el logo */
    :root {
      --bg-dark: #03001c;       /* Azul muy oscuro del fondo */
      --bg-card: #0a0438;       /* Azul un poco más claro para tarjetas */
      --cyan: #00e5ff;          /* Cian brillante de la flecha */
      --magenta: #ff0080;       /* Rosa/Magenta de la flecha */
      --white: #ffffff;
      --text-muted: #a0a5c0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      /* Fondo con un sutil degradado radial para dar profundidad */
      background-image: radial-gradient(circle at 50% -20%, #1a0b5e 0%, var(--bg-dark) 60%);
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Sección Principal (Hero) */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding-top: 40px;
      padding-bottom: 60px;
    }

    /* Logo principal grande */
    .main-logo {
      width: 160px;
      height: 160px;
      border-radius: 35px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 40px rgba(0, 229, 255, 0.1);
      margin-bottom: 10px;
      transition: transform 0.3s ease;
    }

    .main-logo:hover {
      transform: translateY(-5px) scale(1.02);
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    /* Degradado de texto usando los colores del logo */
    .gradient-text {
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p.subtitle {
      font-size: clamp(1.1rem, 3vw, 1.3rem);
      color: var(--text-muted);
      max-width: 500px;
      margin-bottom: 32px;
      font-weight: 400;
    }

    /* Botones */
    .btn-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 36px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--cyan) 0%, var(--magenta) 100%);
      color: var(--bg-dark);
      box-shadow: 0 10px 20px rgba(255, 0, 128, 0.2);
      border: none;
    }

    .btn-primary:hover {
      box-shadow: 0 15px 30px rgba(0, 229, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--white);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      transform: translateY(-2px);
    }

    /* Footer minimalista */
    footer {
      padding: 30px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Animaciones */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animación secuencial para los elementos */
    .hero > *:nth-child(1) { animation: fadeUp 0.6s ease-out 0.1s forwards; opacity: 0; }
    .hero > *:nth-child(2) { animation: fadeUp 0.6s ease-out 0.2s forwards; opacity: 0; }
    .hero > *:nth-child(3) { animation: fadeUp 0.6s ease-out 0.3s forwards; opacity: 0; }
    .hero > *:nth-child(4) { animation: fadeUp 0.6s ease-out 0.4s forwards; opacity: 0; }

    @media (max-width: 600px) {
      .main-logo {
        width: 120px;
        height: 120px;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <main class="hero">

      <svg class="main-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
        <!-- Fondo redondeado oscuro -->
        <rect width="100%" height="100%" rx="110" fill="#0b0347"/>
        
        <!-- Letra G y efectos de degradado (Blancos/Azules) -->

        <path fill="#a8c0ff" d="M390 149.5c-15.7 11.2-32.7 20.7-50.8 28.3-4.2-6.2-8.9-12-14.1-17.4-5.2-5.4-10.8-10.4-16.7-14.9l-5.1-3.9c22.3-8.5 46-13.2 70.7-13.2 5.4 0 10.7.2 16 .5z" opacity=".7"/>
        <path fill="#a8c0ff" d="M355.8 374.6c-22 20.1-48.8 34.6-78.2 41.4-6.9 1.6-13.9 2.6-21 3-29.3 1.8-57.7-4-83.1-16.1 8.2-18.1 18.2-35 29.7-50.6 18.4 10.3 39.5 16.2 61.8 16.2 38.7 0 73.3-18.1 96.5-46.1 5 7.5 9.6 15.4 13.6 23.6-6 9.8-12.5 19.3-19.3 28.6z" opacity=".7"/>
        <path fill="#ffffff" d="M280.5 395.6c-14.3 4.5-29.6 7-45.5 7-30.2 0-58.5-8.5-82.6-23.2 8-16.4 17.6-31.7 28.7-45.7 15.7 9 33.8 14.2 53.1 14.2 17.3 0 33.6-4 48.2-11.1 2.2 6.1 4.2 12.3 6 18.6-2.6 3.4-5.3 6.7-8.1 9.9-2.3 2.3-4.7 4.6-7.1 6.8z" opacity=".9"/>

        <!-- Flecha Cian (Arriba) -->
        <path fill="#00e5ff" d="M160 210h140l-20-20 65 20-65 20 20-20H160z"/>
        
        <!-- Flecha Magenta/Rosa (Abajo) -->
        <path fill="#ff0080" d="M186 280h130l-20-20 65 20-65 20 20-20H186z"/>
      </svg>

      <h1>Gestión de guardias <br><span class="gradient-text">sin límites</span></h1>
      
      <p class="subtitle">La app definitiva para organizar el servicio de guardia en tu centro educativo de forma rápida, visual y automatizada.</p>
      
      <div class="btn-group">
        <a href="#" class="btn btn-primary" onclick="alert('¡Gracias por tu interés! Aquí iría el enlace a la App Store / Google Play.')">Descargar App</a>
        <a href="#" class="btn btn-secondary" onclick="alert('Aquí se abriría el formulario de contacto.')">Contactar</a>
      </div>

    </main>
  </div>

  <footer>
    © 2025 GuardiAnd · El centro bajo control.
  </footer>

</body>
</html>
