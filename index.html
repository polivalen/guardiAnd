<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardiAnd · Gestión de guardias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    /* Variables de color basadas en el logo */
    :root {
      --bg-dark: #03001c;       
      --cyan: #00e5ff;          
      --magenta: #ff0080;       
      --white: #ffffff;
      --text-muted: #a0a5c0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 50% -20%, #1a0b5e 0%, var(--bg-dark) 60%);
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding-top: 40px;
      padding-bottom: 60px;
    }

    /* Estilos aplicados a la imagen del logo */
    .main-logo {
      width: 170px;
      height: 170px;
      border-radius: 35px; /* Bordes redondeados como el icono de una app */
      object-fit: cover;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 229, 255, 0.15);
      margin-bottom: 10px;
      transition: transform 0.3s ease;
    }

    .main-logo:hover {
      transform: translateY(-5px) scale(1.03);
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p.subtitle {
      font-size: clamp(1.1rem, 3vw, 1.3rem);
      color: var(--text-muted);
      max-width: 500px;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 36px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--cyan) 0%, var(--magenta) 100%);
      color: var(--bg-dark);
      box-shadow: 0 10px 20px rgba(255, 0, 128, 0.2);
      border: none;
    }

    .btn-primary:hover {
      box-shadow: 0 15px 30px rgba(0, 229, 255, 0.3);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--white);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      transform: translateY(-2px);
    }

    footer {
      padding: 30px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      opacity: 0.7;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero > *:nth-child(1) { animation: fadeUp 0.6s ease-out 0.1s forwards; opacity: 0; }
    .hero > *:nth-child(2) { animation: fadeUp 0.6s ease-out 0.2s forwards; opacity: 0; }
    .hero > *:nth-child(3) { animation: fadeUp 0.6s ease-out 0.3s forwards; opacity: 0; }
    .hero > *:nth-child(4) { animation: fadeUp 0.6s ease-out 0.4s forwards; opacity: 0; }

    @media (max-width: 600px) {
      .main-logo {
        width: 130px;
        height: 130px;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <main class="hero">
      
      <!-- Aquí cargamos tu imagen. Asegúrate de que el archivo se llame logo.png y esté en la misma carpeta -->
      <img src="logo.png" alt="Logo GuardiAnd" class="main-logo">

      <h1>Gestión de guardias <br><span class="gradient-text">sin límites</span></h1>
      
      <p class="subtitle">La app definitiva para organizar el servicio de guardia en tu centro educativo de forma rápida, visual y automatizada.</p>
      
      <div class="btn-group">
        <a href="#" class="btn btn-primary" onclick="alert('¡Gracias por tu interés! Aquí iría el enlace a la App Store / Google Play.')">Descargar App</a>
        <a href="#" class="btn btn-secondary" onclick="alert('Aquí se abriría el formulario de contacto.')">Contactar</a>
      </div>

    </main>
  </div>

  <footer>
    © 2025 GuardiAnd · El centro bajo control.
  </footer>

</body>
</html>
